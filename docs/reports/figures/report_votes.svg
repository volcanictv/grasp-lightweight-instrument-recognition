<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Example: 80 votes, 68 for the winning class and 12 against, a 15 percent disagreement, above the 9 percent gate, so the instrument is sent to tracking" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="11"><text x="10.0" y="22.0" fill="#1e293b" text-anchor="start" font-size="12" font-weight="600">Example: how one instrument is decided</text><text x="10.0" y="60.0" fill="#1e293b" text-anchor="start" font-size="11" font-weight="600">4 members × 20 passes</text><text x="10.0" y="76.0" fill="#475569" text-anchor="start" font-size="11" font-weight="400">= 80 votes, each for the</text><text x="10.0" y="91.0" fill="#475569" text-anchor="start" font-size="11" font-weight="400">class of its largest output</text><path d="M188,88 H240" stroke="#898781" stroke-width="1.5" fill="none"/><path d="M240,88 l-7,-4 v8 z" fill="#898781"/><path d="M250,78 h406.0 v24 h-406.0 z" fill="#2a78d6"><title>68 of 80 votes for the winning class</title></path><path d="M658.0,78 h68.0 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-68.0 z" fill="#eb6834"><title>12 of 80 votes for other classes</title></path><text x="260.0" y="94.0" fill="#ffffff" text-anchor="start" font-size="11" font-weight="600">68 votes: the winning class (85%)</text><text x="666.0" y="94.0" fill="#1e293b" text-anchor="start" font-size="11" font-weight="600">12 (15%)</text><text x="250.0" y="66.0" fill="#1e293b" text-anchor="start" font-size="11" font-weight="600">Prediction = the class with the most votes</text><text x="730.0" y="66.0" fill="#1e293b" text-anchor="end" font-size="11" font-weight="600">Uncertainty = share of votes against it</text><line x1="686.8" y1="104.0" x2="686.8" y2="114.0" stroke="#1e293b" stroke-width="1.5"/><path d="M686.8,114 H728.0" stroke="#1e293b" stroke-width="1.5" fill="none"/><line x1="728.0" y1="104.0" x2="728.0" y2="114.0" stroke="#1e293b" stroke-width="1.5"/><text x="678.8" y="118.0" fill="#1e293b" text-anchor="end" font-size="11" font-weight="600">gate: 9% disagreement</text><rect x="250" y="146" width="480" height="34" rx="6" fill="#eaf3ee" stroke="#2f7d52" stroke-width="1"/><text x="490.0" y="167.0" fill="#1e293b" text-anchor="middle" font-size="12" font-weight="600">15% of votes disagree, which is 9% or more: send this instrument to tracking</text><rect x="10" y="140" width="14" height="12" rx="3" fill="#2a78d6"/><text x="34.0" y="150.0" fill="#475569" text-anchor="start" font-size="11" font-weight="400">votes for the winning class</text><rect x="10" y="160" width="14" height="12" rx="3" fill="#eb6834"/><text x="34.0" y="170.0" fill="#475569" text-anchor="start" font-size="11" font-weight="400">votes for any other class</text></svg>