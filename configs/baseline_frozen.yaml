task: multilabel_frame
model:
  name: mobilenet_v3_small
  pretrained: true
  freeze_backbone: true
data:
  split: official # official | fold1 | fold2
  image_size: 224
  sampling: none # none | weighted | oversample
loss:
  type: bce
  class_weights: false
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  seed: 42
