task: region_classification
model:
  name: resnet50
  pretrained: true
  freeze_backbone: false
data:
  split: fold1 # one variable vs region_letterbox_resnet50_320_fold1.yaml: context_expand added.
  image_size: 320
  augmentation: default # default | strong
  letterbox_crop: true
  context_expand: true # expand small instances' crop to include surrounding context instead of
                        # a tight mask-multiplied crop -- docs/DECISIONS.md 2026-09-04, testing
                        # whether small-crop errors are fixable rather than just gated around.
  context_area_threshold: 0.04 # same area-fraction definition as the class-conditional
                                # abstention gate's threshold
  context_expand_factor: 2.0
loss:
  type: cross_entropy
  class_weights: true
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  backbone_lr: 0.0001
  seed: 42
