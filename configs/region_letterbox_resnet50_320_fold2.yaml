task: region_classification
model:
  name: resnet50
  pretrained: true
  freeze_backbone: false
data:
  split: fold2 # fold2 counterpart of region_letterbox_resnet50_320_fold1.yaml -- confirmatory
               # baseline for the strong-aug fold2 check (2026-09-04).
  image_size: 320
  augmentation: default # default | strong
  letterbox_crop: true
loss:
  type: cross_entropy
  class_weights: true
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  backbone_lr: 0.0001
  seed: 42
