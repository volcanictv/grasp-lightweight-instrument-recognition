task: region_classification
model:
  name: mobilenet_v3_small
  pretrained: true
  freeze_backbone: false
data:
  split: official
  image_size: 224
  augmentation: default
  letterbox_crop: true
  val_split_override: fold1
  neighbour_dir:
  - experiments/temporal_neighbors/fold1
  - experiments/temporal_neighbors/fold2
  neighbour_prob: 0.5
loss:
  type: evidential
  class_weights: true
  edl_lambda: 0.01
  edl_anneal_epochs: 10
  edl_clamp: 10.0
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  backbone_lr: 0.0001
  seed: 43
  select_best: false
