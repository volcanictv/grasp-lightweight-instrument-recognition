task: region_classification
model:
  name: resnet50
  pretrained: true
  freeze_backbone: false
data:
  split: fold1 # one variable vs region_letterbox_resnet50_320_fold1.yaml: data.sampling added.
  image_size: 320
  augmentation: default # default | strong
  letterbox_crop: true
  sampling: area_weighted # oversample small-mask instances during training -- distinct axis
                           # from class-frequency weighting, see samplers.py.
  area_oversample_threshold: 0.04 # same area-fraction definition as the class-conditional
                                   # abstention gate's threshold
  area_oversample_factor: 3.0
loss:
  type: cross_entropy
  class_weights: true
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  backbone_lr: 0.0001
  seed: 42
