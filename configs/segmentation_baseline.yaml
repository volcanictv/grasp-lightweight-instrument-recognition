task: segmentation
model:
  name: centroid_offset_mobilenet_v3
  pretrained: true
data:
  split: official
  image_size: 384
  output_stride: 4
loss:
  offset_weight: 0.1 # CenterNet convention: down-weight regression vs. the heatmap head.
  semantic_weight: 1.0
training:
  batch_size: 8
  epochs: 100 # ceiling, not a target
  patience: 10
  optimizer: adam
  lr: 0.0001
  seed: 42
