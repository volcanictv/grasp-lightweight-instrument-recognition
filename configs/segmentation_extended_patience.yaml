task: segmentation
model:
  name: centroid_offset_mobilenet_v3
  pretrained: true
data:
  split: official
  image_size: 384
  output_stride: 4
loss:
  offset_weight: 0.1 # CenterNet convention: down-weight regression vs. the heatmap head.
  semantic_weight: 1.0
training:
  batch_size: 8
  epochs: 150 # ceiling, not a target
  patience: 30 # segmentation_baseline.yaml (patience 10) stopped on val mIoU
               # plateau at epoch 39 while heatmap loss was still steadily
               # decreasing (0.42 -> 0.23 in its last 10 epochs) -- mIoU
               # (semantic head) converges faster than the heatmap head
               # needs to produce sharp, well-separated peaks for instance
               # decoding. Diagnosed via a real peak-count sweep on that
               # checkpoint (docs/DECISIONS.md): 14-41 spurious peaks per
               # image vs. 1-4 real instances at the old decode defaults.
               # More patience gives the heatmap head room to keep sharpening
               # past the point semantic mIoU alone looks "done".
  optimizer: adam
  lr: 0.0001
  seed: 42
