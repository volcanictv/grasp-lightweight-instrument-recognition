task: segmentation
model:
  name: centroid_offset_mobilenet_v3_deep # returned_layers=[1,3,5] instead of [1,2] --
                                            # the shallow variant's mobilenet_backbone call
                                            # never computed MobileNetV3-Large's deep,
                                            # semantically-rich layers at all (pruned, not
                                            # frozen), a real capacity bug diagnosed after
                                            # four shallow-variant runs plateaued at the same
                                            # numbers regardless of training recipe. See
                                            # models/segmenters/centroid_offset.py and
                                            # docs/DECISIONS.md (2026-09-01).
  pretrained: true
data:
  split: official
  image_size: 384
  output_stride: 4
loss:
  offset_weight: 0.1 # CenterNet convention: down-weight regression vs. the heatmap head.
  semantic_weight: 1.0
training:
  batch_size: 8
  epochs: 200 # ceiling, not a target
  patience: 40 # matching segmentation_cosine_lr.yaml exactly -- the only
               # variable changed in this run is the backbone's returned_layers.
  optimizer: adam
  lr: 0.0001
  lr_schedule: cosine
  seed: 42
