task: region_classification
model:
  name: resnet50
  pretrained: true
  freeze_backbone: false
data:
  split: fold1 # one variable vs region_area_oversample_fold1.yaml: sampling restricted to
               # area_oversample_classes instead of applying uniformly.
  image_size: 320
  augmentation: default # default | strong
  letterbox_crop: true
  sampling: area_weighted_classcond # boost small-mask instances only for the named classes --
                                     # docs/DECISIONS.md 2026-09-05 found the uniform version
                                     # helped these two but cost Large Needle Driver / Monopolar
                                     # Curved Scissors on the same subset.
  area_oversample_threshold: 0.04
  area_oversample_factor: 3.0
  area_oversample_classes:
    - Bipolar Forceps
    - Prograsp Forceps
loss:
  type: cross_entropy
  class_weights: true
training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  backbone_lr: 0.0001
  seed: 42
